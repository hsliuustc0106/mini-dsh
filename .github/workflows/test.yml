name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  keyless:
    name: Deterministic tests and keyless replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated benchmark runner
        run: docker pull node:22-alpine
      - run: npm test
        env:
          BENCHMARK_TEST_DOCKER: '1'
      - run: npm run replay
